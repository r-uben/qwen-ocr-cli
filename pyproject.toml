[project]
name = "qwen-ocr"
version = "0.1.0"
description = "OCR via Qwen-VL with smart local/self-hosted/cloud backend selection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ocr-output-contract @ git+https://github.com/r-uben/ocr-output-contract@v0.1.0",
    "click>=8.1",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pillow>=10.0",
]

[project.scripts]
qwen-ocr = "qwen_ocr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_ocr"]

# Required so the git+https direct reference to ocr-output-contract is allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["integration: hits live models/servers; excluded from default run"]
addopts = "-m 'not integration'"
